<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">

<defs>

  <!-- BACKGROUND -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020914"/>
    <stop offset="48%" stop-color="#06233D"/>
    <stop offset="100%" stop-color="#01050B"/>
  </linearGradient>

  <!-- TITLE -->
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="55%" stop-color="#58C2FF"/>
    <stop offset="100%" stop-color="#C8F0FF"/>
  </linearGradient>

  <!-- GLASS -->
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#123653"/>
    <stop offset="100%" stop-color="#061522"/>
  </linearGradient>

  <!-- SQL GLOW -->
  <radialGradient id="glow">
    <stop offset="0%" stop-color="#168BFF" stop-opacity=".30"/>
    <stop offset="100%" stop-color="#168BFF" stop-opacity="0"/>
  </radialGradient>

  <!-- GRID -->
  <pattern id="grid"
           width="40"
           height="40"
           patternUnits="userSpaceOnUse">

    <path d="M40 0H0V40"
          fill="none"
          stroke="#63C8FF"
          stroke-opacity=".045"/>

  </pattern>

  <!-- GLOW FILTER -->
  <filter id="blueGlow"
          x="-100%"
          y="-100%"
          width="300%"
          height="300%">

    <feGaussianBlur stdDeviation="4"
                    result="blur"/>

    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>

  </filter>

</defs>


<!-- ===================================================== -->
<!-- BACKGROUND -->
<!-- ===================================================== -->

<rect width="1200"
      height="500"
      rx="28"
      fill="url(#bg)"/>

<circle cx="125"
        cy="210"
        r="300"
        fill="url(#glow)"/>

<circle cx="1080"
        cy="210"
        r="300"
        fill="url(#glow)"
        opacity=".45"/>

<rect width="1200"
      height="500"
      rx="28"
      fill="url(#grid)"/>


<!-- ===================================================== -->
<!-- LEFT : SQL DATABASE OBJECT -->
<!-- ===================================================== -->

<g transform="translate(145 215)">

  <!-- OUTER ROTATING RING -->
  <circle r="92"
          fill="none"
          stroke="#299EFF"
          stroke-opacity=".18"
          stroke-width="1"
          stroke-dasharray="5 10">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0"
      to="360"
      dur="18s"
      repeatCount="indefinite"/>

  </circle>


  <!-- SECOND RING -->
  <circle r="70"
          fill="none"
          stroke="#63C8FF"
          stroke-opacity=".14"
          stroke-dasharray="2 11">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="360"
      to="0"
      dur="12s"
      repeatCount="indefinite"/>

  </circle>


  <!-- DATABASE CYLINDER -->
  <ellipse cx="0"
           cy="-48"
           rx="48"
           ry="15"
           fill="#0C3554"
           stroke="#63C8FF"
           stroke-opacity=".55"/>

  <path d="M-48 -48
           V47
           C-48 57 -27 63 0 63
           C27 63 48 57 48 47
           V-48"
        fill="#071B2C"
        stroke="#299EFF"
        stroke-opacity=".55"/>


  <!-- DATABASE LAYERS -->
  <ellipse cx="0"
           cy="-17"
           rx="48"
           ry="14"
           fill="none"
           stroke="#299EFF"
           stroke-opacity=".35"/>

  <ellipse cx="0"
           cy="15"
           rx="48"
           ry="14"
           fill="none"
           stroke="#299EFF"
           stroke-opacity=".30"/>

  <ellipse cx="0"
           cy="47"
           rx="48"
           ry="14"
           fill="none"
           stroke="#299EFF"
           stroke-opacity=".25"/>


  <!-- SQL TEXT -->
  <text x="0"
        y="7"
        text-anchor="middle"
        fill="#FFFFFF"
        font-family="Arial"
        font-size="19"
        font-weight="800"
        letter-spacing="2">
    SQL
  </text>


  <!-- MOVING DATA NODE -->
  <circle cx="0"
          cy="-92"
          r="4"
          fill="#63C8FF"
          filter="url(#blueGlow)">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0"
      to="360"
      dur="7s"
      repeatCount="indefinite"/>

  </circle>

</g>


<!-- ===================================================== -->
<!-- MAIN TITLE -->
<!-- ===================================================== -->

<g transform="translate(275 52)">

  <text x="0"
        y="0"
        fill="#63C8FF"
        font-family="Arial"
        font-size="11"
        font-weight="700"
        letter-spacing="2.5">
    DATA ANALYSIS • SQL WORKFLOW
  </text>


  <rect x="0"
        y="18"
        width="65"
        height="3"
        rx="2"
        fill="#299EFF"/>


  <text x="0"
        y="68"
        fill="url(#titleGrad)"
        font-family="Arial"
        font-size="43"
        font-weight="800">
    TASK 2 : SQL
  </text>

</g>


<!-- ===================================================== -->
<!-- CENTER SQL QUERY VISUAL -->
<!-- ===================================================== -->

