    <text x="400"
          y="19"
          text-anchor="end"
          fill="#4E7897"
          font-family="Arial"
          font-size="7">
      DATA INTEGRITY ✓
    </text>


    <!-- TABLE -->
    <g transform="translate(15 29)"
       stroke="#63C8FF"
       stroke-opacity=".10">

      <path d="M0 18H389"/>
      <path d="M0 36H389"/>

      <path d="M75 0V58"/>
      <path d="M160 0V58"/>
      <path d="M255 0V58"/>

    </g>


    <g fill="#63C8FF"
       font-family="Arial"
       font-size="7"
       font-weight="700">

      <text x="25" y="42">ID</text>
      <text x="100" y="42">DEPARTMENT</text>
      <text x="190" y="42">MONTH</text>
      <text x="280" y="42">RESULT</text>

    </g>


    <g fill="#7897AB"
       font-family="Arial"
       font-size="7">

      <text x="25" y="60">101</text>
      <text x="100" y="60">Support</text>
      <text x="190" y="60">Jan</text>
      <text x="280" y="60">PASS</text>

    </g>


    <!-- scanning line -->
    <rect x="15"
          y="30"
          width="389"
          height="1"
          fill="#63C8FF"
          opacity=".45">

      <animate attributeName="y"
               values="30;85;30"
               dur="3s"
               repeatCount="indefinite"/>

    </rect>

  </g>

</g>


<!-- ===================================================== -->
<!-- RIGHT SQL PIPELINE -->
<!-- ===================================================== -->

<g transform="translate(790 42)">

  <!-- SHADOW -->
