<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020914"/>
      <stop offset="48%" stop-color="#06203A"/>
      <stop offset="100%" stop-color="#01050B"/>
    </linearGradient>

    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#168BFF" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#168BFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#55BFFF"/>
      <stop offset="100%" stop-color="#BDEBFF"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123552" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#061421" stop-opacity=".96"/>
    </linearGradient>

    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none"
            stroke="#69CFFF"
            stroke-opacity=".045"/>
    </pattern>

    <filter id="glow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

      <feGaussianBlur stdDeviation="5"
                      result="blur"/>

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

  </defs>


  <!-- ========================= -->
  <!-- BACKGROUND -->
  <!-- ========================= -->

  <rect width="1200"
        height="500"
        rx="28"
        fill="url(#bg)"/>

  <circle cx="140"
          cy="190"
          r="340"
          fill="url(#blueGlow)"/>

  <circle cx="1050"
          cy="230"
          r="340"
          fill="url(#blueGlow)"
          opacity=".55"/>

  <rect width="1200"
        height="500"
        rx="28"
        fill="url(#grid)"/>


  <!-- ========================= -->
  <!-- LEFT ANALYTICS ORBIT -->
  <!-- ========================= -->

  <g transform="translate(140 225)">

    <circle r="112"
            fill="#168BFF"
            opacity=".035"/>

    <circle r="94"
            fill="none"
            stroke="#299EFF"
            stroke-opacity=".22"
            stroke-width="1"
            stroke-dasharray="5 9">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="18s"
        repeatCount="indefinite"/>

    </circle>


    <circle r="72"
            fill="none"
            stroke="#63C8FF"
            stroke-opacity=".18"
            stroke-dasharray="2 12">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360"
        to="0"
        dur="12s"
        repeatCount="indefinite"/>

    </circle>


    <!-- moving nodes -->

    <g>

      <circle cy="-94"
              r="5"
              fill="#63C8FF"
              filter="url(#glow)"/>

      <circle cx="94"
              r="4"
              fill="#299EFF"/>

      <circle cx="-94"
              r="4"
              fill="#299EFF"/>

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="9s"
        repeatCount="indefinite"/>

    </g>


    <!-- core -->

    <circle r="57"
            fill="#071827"
            stroke="#299EFF"
            stroke-opacity=".45"/>

    <circle r="33"
            fill="#0A2339"
            stroke="#63C8FF"
            stroke-opacity=".35"/>


    <!-- sweep -->

    <path d="M0 0
             L0-54
             A54 54 0 0 1 39-38
             Z"
          fill="#299EFF"
          opacity=".18">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="4s"
        repeatCount="indefinite"/>

    </path>


    <!-- customer icon -->

    <circle cy="-9"
            r="8"
            fill="#FFFFFF"/>

    <path d="M-17 20
             C-17 8 -9 2 0 2
             S17 8 17 20"
          fill="none"
          stroke="#63C8FF"
          stroke-width="6"
          stroke-linecap="round"/>


    <!-- pulse -->

    <circle r="32"
            fill="none"
            stroke="#299EFF">

      <animate attributeName="r"
               values="32;70;32"
               dur="3s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values=".7;0;.7"
               dur="3s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ========================= -->
  <!-- MAIN TITLE -->
  <!-- ========================= -->

  <g transform="translate(275 70)">

    <text fill="#63C8FF"
          font-family="Arial"
          font-size="12"
          font-weight="700"
          letter-spacing="3">

      CUSTOMER EXPERIENCE • ANALYTICS

    </text>


    <rect y="22"
          width="78"
          height="4"
          rx="2"
          fill="#299EFF"/>


    <text y="92"
          fill="url(#title)"
          font-family="Arial"
          font-size="49"
          font-weight="800">

      CUSTOMER

    </text>


    <text y="147"
          fill="#FFFFFF"
          font-family="Arial"
          font-size="49"
          font-weight="800">

      SUPPORT

    </text>


    <text y="197"
          fill="#63C8FF"
          font-family="Arial"
          font-size="36"
          font-weight="800">

      QUALITY ANALYSIS

    </text>


    <rect y="220"
          width="395"
          height="2"
          fill="#299EFF"
          opacity=".45"/>


    <text y="250"
          fill="#718BA2"
          font-family="Arial"
          font-size="10.5"
          letter-spacing="1.5">

      SERVICE SIGNALS • CUSTOMER VOICE • QUALITY INSIGHTS

    </text>


    <circle cx="5"
            cy="282"
            r="5"
            fill="#299EFF">

      <animate attributeName="r"
               values="4;7;4"
               dur="2s"
               repeatCount="indefinite"/>

    </circle>


    <text x="18"
          y="286"
          fill="#8DA4B8"
          font-family="Arial"
          font-size="10"
          letter-spacing="1">

      LIVE CUSTOMER SIGNAL

    </text>

  </g>


  <!-- ========================= -->
  <!-- RIGHT KPI PANEL -->
  <!-- ========================= -->

  <g transform="translate(775 35)">

    <rect x="4"
          y="8"
          width="375"
          height="390"
          rx="28"
          fill="#000000"
          opacity=".35"/>


    <rect width="375"
          height="390"
          rx="28"
          fill="url(#glass)"
          stroke="#58BFFF"
          stroke-opacity=".22"/>


    <circle cx="28"
            cy="32"
            r="5"
            fill="#299EFF"
            filter="url(#glow)">

      <animate attributeName="opacity"
               values="1;.25;1"
               dur="1.8s"
               repeatCount="indefinite"/>

    </circle>


    <text x="43"
          y="37"
          fill="#FFFFFF"
          font-family="Arial"
          font-size="12"
          font-weight="700"
          letter-spacing="2">

      QUALITY CONTROL

    </text>


    <text x="345"
          y="36"
          text-anchor="end"
          fill="#5E7890"
          font-family="Arial"
          font-size="9"
          letter-spacing="1">

      LIVE

    </text>


    <rect x="25"
          y="57"
          width="325"
          height="1"
          fill="#FFFFFF"
          opacity=".07"/>


    <!-- QUALITY -->

    <g transform="translate(90 145)">

      <circle r="62"
              fill="none"
              stroke="#17354F"
              stroke-width="9"/>


      <circle r="62"
              fill="none"
              stroke="#299EFF"
              stroke-width="9"
              stroke-linecap="round"
              stroke-dasharray="337 390"
              transform="rotate(-90)"
              filter="url(#glow)"/>


      <text y="-3"
            text-anchor="middle"
            fill="#FFFFFF"
            font-family="Arial"
            font-size="26"
            font-weight="800">

        92%

      </text>


      <text y="17"
            text-anchor="middle"
            fill="#7892A7"
            font-family="Arial"
            font-size="9"
            letter-spacing="1.5">

        QUALITY

      </text>

    </g>


    <!-- CSAT -->

    <g transform="translate(168 82)">

      <rect width="165"
            height="60"
            rx="14"
            fill="#0B2339"
            stroke="#63C8FF"
            stroke-opacity=".14"/>


      <text x="15"
            y="21"
            fill="#718BA1"
            font-family="Arial"
            font-size="9"
            letter-spacing="1.5">

        CSAT SCORE

      </text>


      <text x="15"
            y="45"
            fill="#FFFFFF"
            font-family="Arial"
            font-size="20"
            font-weight="800">

        4.7/5

      </text>

    </g>


    <!-- RESPONSE -->

    <g transform="translate(168 152)">

      <rect width="165"
            height="60"
            rx="14"
            fill="#0B2339"
            stroke="#63C8FF"
            stroke-opacity=".14"/>


      <text x="15"
            y="21"
            fill="#718BA1"
            font-family="Arial"
            font-size="9"
            letter-spacing="1.5">

        RESPONSE TIME

      </text>


      <text x="15"
            y="45"
            fill="#FFFFFF"
            font-family="Arial"
            font-size="20"
            font-weight="800">

        2.4m

      </text>


      <path d="M123 43
               L133 33
               L140 39
               L151 26"
            fill="none"
            stroke="#299EFF"
            stroke-width="2"
            stroke-linecap="round"/>

    </g>


    <!-- SIGNAL -->

    <text x="25"
          y="245"
          fill="#70879B"
          font-family="Arial"
          font-size="9"
          letter-spacing="1.8">

      CUSTOMER SIGNAL

    </text>


    <path d="M25 280
             C33 280 33 267 41 267
             S49 290 57 290
             S65 260 73 260
             S81 283 89 283
             S97 269 105 269
             S113 289 121 289
             S129 264 137 264
             S145 280 153 280"
          fill="none"
          stroke="#299EFF"
          stroke-width="2.5"
          stroke-linecap="round"
          filter="url(#glow)"/>


    <!-- chat -->

    <g transform="translate(180 255)">

      <rect width="150"
            height="55"
            rx="14"
            fill="#0C2941"
            stroke="#299EFF"
            stroke-opacity=".22"/>


      <circle cx="18"
              cy="19"
              r="6"
              fill="#299EFF"/>


      <rect x="33"
            y="13"
            width="74"
            height="5"
            rx="2"
            fill="#FFFFFF"
            opacity=".72"/>


      <rect x="33"
            y="26"
            width="50"
            height="5"
            rx="2"
            fill="#63C8FF"
            opacity=".3"/>

    </g>


    <rect x="25"
          y="350"
          width="325"
          height="1"
          fill="#FFFFFF"
          opacity=".07"/>


    <circle cx="31"
            cy="373"
            r="4"
            fill="#299EFF"/>


    <text x="43"
          y="377"
          fill="#71899E"
          font-family="Arial"
          font-size="9"
          letter-spacing="1.2">

      CUSTOMER VOICE → SERVICE INSIGHT

    </text>

  </g>


  <!-- ========================= -->
  <!-- BOTTOM SIGNAL -->
  <!-- ========================= -->

  <g transform="translate(275 405)">

    <rect width="440"
          height="1"
          fill="#63C8FF"
          opacity=".22"/>


    <circle r="4"
            fill="#299EFF"
            filter="url(#glow)">

      <animate attributeName="cx"
               values="0;440;0"
               dur="7s"
               repeatCount="indefinite"/>

    </circle>


    <text y="25"
          fill="#647E95"
          font-family="Arial"
          font-size="9"
          letter-spacing="1.7">

      SERVICE • SATISFACTION • RESPONSE • RESOLUTION

    </text>

  </g>


  <!-- ================================================= -->
  <!-- EXAMINER CAUTION — EXACT TEXT -->
  <!-- ================================================= -->

  <g transform="translate(45 452)">

    <rect width="1110"
          height="38"
          rx="12"
          fill="#061523"
          stroke="#299EFF"
          stroke-opacity=".45"/>


    <!-- Animated left accent -->

    <rect width="5"
          height="38"
          rx="2"
          fill="#299EFF">

      <animate attributeName="opacity"
               values="1;.35;1"
               dur="2s"
               repeatCount="indefinite"/>

    </rect>


    <!-- Warning icon -->

    <path d="M25 28
             L34 11
             Q35 9 37 11
             L46 28
             Q47 30 44 30
             H27
             Q24 30 25 28Z"
          fill="#299EFF"
          fill-opacity=".18"
          stroke="#63C8FF"/>


    <text x="35"
          y="25"
          text-anchor="middle"
          fill="#FFFFFF"
          font-family="Arial"
          font-size="10"
          font-weight="800">

      !

    </text>


    <!-- Caution heading -->

    <text x="58"
          y="16"
          fill="#63C8FF"
          font-family="Arial"
          font-size="8"
          font-weight="800"
          letter-spacing="1.2">

      EXAMINER CAUTION

    </text>


    <!-- EXACT USER CAUTION -->

    <text x="58"
          y="29"
          fill="#D0DDE8"
          font-family="Arial"
          font-size="8.5">

      Keep all formulas and the PivotTable editable. Screenshots alone do not satisfy E3. The examiner must be able to open the .xlsx and see live formulas.

    </text>


    <!-- Animated status dot -->

    <circle cx="1085"
            cy="19"
            r="4"
            fill="#299EFF"
            filter="url(#glow)">

      <animate attributeName="opacity"
               values="1;.2;1"
               dur="1.8s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- CORNER ACCENTS -->

  <path d="M0 452
           V475
           Q0 500 25 500
           H58"
        fill="none"
        stroke="#299EFF"
        stroke-width="3"/>


  <path d="M1200 48
           V25
           Q1200 0 1175 0
           H1142"
        fill="none"
        stroke="#63C8FF"
        stroke-width="3"/>

</svg>
