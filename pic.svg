  <!-- ================================================= -->
  <!-- RESULT TABLE -->
  <!-- ================================================= -->

  <g transform="translate(18 145)">

    <rect width="419"
          height="87"
          rx="12"
          fill="#06131F"
          stroke="#299EFF"
          stroke-opacity=".20"/>


    <text x="15"
