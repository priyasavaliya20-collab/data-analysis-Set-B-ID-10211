<svg xmlns="http://www.w3.org/2000/svg"
     width="1280"
     height="420"
     viewBox="0 0 1280 420">

<defs>

  <!-- BACKGROUND -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070C13"/>
    <stop offset="55%" stop-color="#0B1119"/>
    <stop offset="100%" stop-color="#05080D"/>
  </linearGradient>

  <!-- BOX -->
  <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#161D25"/>
    <stop offset="100%" stop-color="#0C1219"/>
  </linearGradient>

  <!-- BLUE ACCENT -->
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="100%" stop-color="#60A5FA"/>
  </linearGradient>

  <!-- GLOW -->
  <filter id="glow"
          x="-100%"
          y="-100%"
          width="300%"
          height="300%">

    <feGaussianBlur stdDeviation="4"
                    result="blur"/>

    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>

  </filter>

  <!-- GRID -->
  <pattern id="grid"
           width="36"
           height="36"
           patternUnits="userSpaceOnUse">

    <path d="M36 0H0V36"
          fill="none"
          stroke="#5EAFFF"
          stroke-opacity=".035"/>

  </pattern>

  <!-- ARROW -->
  <marker id="arrow"
          markerWidth="8"
          markerHeight="8"
          refX="7"
          refY="4"
          orient="auto">

    <path d="M0 0 L8 4 L0 8 Z"
          fill="#9BA8B5"/>

  </marker>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1280"
      height="420"
      rx="24"
      fill="url(#bg)"/>

<rect width="1280"
      height="420"
      rx="24"
      fill="url(#grid)"/>


<!-- SUBTLE SCAN LINE -->

<rect x="0"
      y="0"
      width="1280"
      height="2"
      fill="#38BDF8"
      opacity=".08">

  <animate attributeName="y"
           values="0;418;0"
           dur="8s"
           repeatCount="indefinite"/>

</rect>


<!-- ================================================= -->
<!-- TITLE -->
<!-- ================================================= -->

<text x="55"
      y="48"
      fill="#FFFFFF"
      font-family="Arial"
      font-size="12"
      font-weight="700"
      letter-spacing="3">
  DATA RECONCILIATION WORKFLOW
</text>

<rect x="55"
      y="61"
      width="62"
      height="3"
      rx="2"
      fill="url(#accent)">

  <animate attributeName="width"
           values="30;62;30"
           dur="2.5s"
           repeatCount="indefinite"/>

</rect>


<!-- ================================================= -->
<!-- RAW CSV -->
<!-- ================================================= -->

<g>

  <rect x="52"
        y="150"
        width="160"
        height="72"
        rx="5"
        fill="url(#box)"
        stroke="#7D8791"
        stroke-width="1.2"/>

  <text x="132"
        y="179"
        text-anchor="middle"
        fill="#DCE5ED"
        font-family="Arial"
        font-size="13"
        font-weight="600">
    Raw CSVs
  </text>

  <text x="132"
        y="201"
        text-anchor="middle"
        fill="#B7C7D5"
        font-family="Arial"
        font-size="12">
    tickets + teams
  </text>

  <circle cx="198"
          cy="160"
          r="3"
          fill="#38BDF8"
          filter="url(#glow)">

    <animate attributeName="r"
             values="2;4;2"
             dur="1.6s"
             repeatCount="indefinite"/>

