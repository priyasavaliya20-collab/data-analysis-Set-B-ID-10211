  </path>


  <!-- ================================================= -->
  <!-- STEP 02 -->
  <!-- ================================================= -->

  <g transform="translate(20 140)">

    <rect width="310"
          height="54"
          rx="13"
          fill="#071C30"
          stroke="#299EFF"
          stroke-opacity=".24"/>


    <circle cx="26"
            cy="27"
            r="17"
            fill="#092B47"
            stroke="#299EFF"
            stroke-opacity=".75"/>


    <text x="26"
          y="31"
          text-anchor="middle"
          fill="#63C8FF"
          font-family="Arial"
          font-size="10"
          font-weight="800">
      02
    </text>


    <text x="49"
          y="22"
          fill="#FFFFFF"
          font-family="Arial"
          font-size="10"
          font-weight="800">
